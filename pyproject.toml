[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simemu"
version = "0.5.0"
description = "Session-based simulator and emulator allocation manager for multi-agent iOS/Android development"
requires-python = ">=3.11"
dependencies = [
  "setproctitle>=1.3",
]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "vykeai"}]
keywords = ["simulator", "emulator", "ios", "android", "testing", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/vykeai/simemu"

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "zeroconf>=0.131.0",
]

[project.scripts]
simemu = "simemu.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simemu*"]
exclude = ["tests*", "simemu/swift*"]

[tool.setuptools.package-data]
simemu = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PIE", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
